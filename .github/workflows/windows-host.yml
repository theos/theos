name: Windows host compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_sdk_e2e:
        description: 'Run protected Windows SDK rootful/rootless E2E on a self-hosted runner'
        required: true
        default: false
        type: boolean

jobs:
  helper-and-make:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install 7-Zip and GNU Make
        shell: pwsh
        run: |
          choco install 7zip make --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey prerequisite installation failed.' }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip'
          $env:PATH = "$sevenZip;$env:PATH"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $sevenZip
          Get-Command 7z.exe, make.exe -ErrorAction Stop
      - name: Install verified portable LLVM and Strawberry Perl
        shell: pwsh
        run: .\bin\install-windows-toolchain.ps1 -PackageManager full-official -AddToUserPath
      - name: Test Windows helper and real Logos preprocessing
        shell: pwsh
        run: |
          $output = python -m unittest discover -s tests/windows -v 2>&1
          $output | ForEach-Object { $_ }
          if (($output | ForEach-Object { $_.ToString() }) -match '(?m)^OK \(.*\bskipped=\d+') { throw 'Windows suite must not skip tests.' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate PowerShell management scripts
        shell: pwsh
        run: |
          $errors = @()
          foreach ($script in 'bin/install-theos.ps1', 'bin/test-windows.ps1', 'bin/manage-theos.ps1', 'bin/install-windows-toolchain.ps1', 'bin/test-windows-toolchain.ps1', 'bin/test-windows-e2e.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
          }
          if ($errors.Count) { $errors | ForEach-Object Message; exit 1 }
      - name: Run native ARM64 Mach-O object, linker, and signing probes
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -ne (Split-Path -Parent $env:THEOS_LDID) }) -join ';'
          .\bin\test-windows-toolchain.ps1 -Clang (Join-Path $env:THEOS_LLVM_BIN 'clang.exe') -Linker $env:THEOS_LD64_LLD -Ldid $env:THEOS_LDID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dry-run original Theos Windows tool recipe graph
        shell: pwsh
        run: |
          $env:THEOS = (Get-Location).Path
          make -C tests/windows/project -n all THEOS=$env:THEOS THEOS_WINDOWS_ALLOW_NO_SDK=1 THEOS_LLVM_BIN=$env:THEOS_LLVM_BIN

  sdk-dependent-e2e:
    name: Windows SDK E2E (opt-in)
    if: ${{ inputs.run_sdk_e2e == true && github.ref == 'refs/heads/windows-port-rc' }}
    environment: protected-sdk-e2e
    permissions:
      contents: read
    runs-on: [self-hosted, Windows, theos-sdk]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Require protected SDK and toolchain
        shell: pwsh
        run: |
          if (-not $env:THEOS_SDKROOT) { throw 'THEOS_SDKROOT must be configured on the protected runner.' }
          if (-not (Test-Path (Join-Path $env:THEOS_SDKROOT 'SDKSettings.plist'))) { throw 'Protected SDK is incomplete.' }
          if (-not $env:THEOS_LDID) { throw 'THEOS_LDID must be configured on the protected runner.' }
      - name: Run rootful and rootless SDK E2E
        shell: pwsh
        run: .\bin\test-windows-e2e.ps1 -TheosPath $env:GITHUB_WORKSPACE
      - name: Assert no SDK or package artifacts are tracked
        shell: pwsh
        run: |
          $tracked = git status --porcelain --untracked-files=all
          if ($tracked -match '(^|\s)sdks/|\.deb$') { throw 'SDK/package artifact appeared in the checkout.' }
